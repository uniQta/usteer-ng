name: Build usteer-ng (OpenWrt 24.10 aarch64_cortex-a53)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt version (SDK)
        default: "24.10.6"
        required: true
        type: string
      create_release:
        description: Create GitHub prerelease
        default: false
        required: true
        type: boolean
  push:
    branches:
      - development
      - master
    paths:
      - ".github/workflows/build.yml"
      - "openwrt/usteer-ng/**"
      - "*.c"
      - "*.h"
      - "CMakeLists.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.openwrt_version || '24.10.6' }}
      ARCH: aarch64_cortex-a53

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package via OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ env.ARCH }}-${{ env.OPENWRT_VERSION }}
          PACKAGES: usteer-ng
          V: sc

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find bin/packages -type f \( -name '*.ipk' -o -name '*.apk' \) -print -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usteer-ng-${{ env.ARCH }}-${{ env.OPENWRT_VERSION }}
          path: artifacts/*

      - name: Create prerelease
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: usteer-ng-${{ env.ARCH }}-${{ env.OPENWRT_VERSION }}-${{ github.run_number }}
          name: usteer-ng ${{ env.ARCH }} OpenWrt ${{ env.OPENWRT_VERSION }}
          body: |
            usteer-ng package build for OpenWrt ${{ env.OPENWRT_VERSION }}
            Target architecture: ${{ env.ARCH }}
          files: artifacts/*
